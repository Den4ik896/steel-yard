<script>/* Telegram держит старый index.html в кэше. Если на сайте версия новее (ver.txt) — перезагружаемся с ?v=, это обходит кэш. Меняй VER и ver.txt вместе при выкладке */
const VER = '21';
fetch('ver.txt?' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(v => { v = v.trim(); if (!v || v === VER) return; try { if (sessionStorage.vr === v) return; sessionStorage.vr = v; } catch (e) {} const q = new URLSearchParams(location.search); q.set('v', v); location.replace(location.pathname + '?' + q + location.hash); }).catch(() => {});
</script>

function drawBG() {

    }

    case 'doBuyL': api('market/buy', { listing: +a.dataset.l }).then(r => { if (r.err) return toast(r.err); hapticN('success'); toast('Куплено! Танк уже в гараже'); mk.ts = 0; itemModal(+id); render(); }); break;
    case 'bid': { const v = parseFloat(($('#inBid') || {}).value); if (!(v > 0)) return toast('Укажи ставку');
      api('market/bid', { listing: +a.dataset.l, amount: v }).then(r => { if (r.err) return toast(r.err); hapticN('success'); toast('Ставка принята — гемы заморожены до конца аукциона'); mk.ts = 0; itemModal(+id); }); break; }
    case 'offer': { const v = parseFloat(($('#inOffer') || {}).value); if (!(v > 0)) return toast('Укажи цену');
      api('market/offer', { item: +id, price: v }).then(r => { if (r.err) return toast(r.err); toast('Предложение отправлено владельцу'); mk.ts = 0; itemModal(+id); }); break; }
    case 'offAccept': api('market/accept', { offer: +a.dataset.o }).then(r => { if (r.err) return toast(r.err); hapticN('success'); toast('Продано!'); mk.ts = 0; closeModal(); render(); }); break;
    case 'offCancel': api('market/offer-cancel', { offer: +a.dataset.o }).then(r => { if (r.err) return toast(r.err); toast('Предложение отменено, гемы вернулись'); mk.ts = 0; closeModal(); render(); }); break;
    case 'gemShop': closeModal(); setTab('shop'); setTimeout(() => { const g = $('#gemShop'); if (g) g.scrollIntoView({ block: 'start' }); }, 150); break;
    case 'nftBuy': { const t = tankById(id); modal(`<div class="ribbon b">Покупка</div><div class="rays" style="--rc:${RAR.limited.hex}"><img src="${icon('t', id, 110)}"></div><div style="font-size:22px">${t.name}</div><div style="font-size:20px;margin:6px 0">💎 ${num(t.gems)}</div><div class="row c"><button class="btn green" data-act="doNftBuy" data-id="${id}">Купить</button><button class="btn gray" data-act="close">Отмена</button></div>`); break; }
    case 'doNftBuy': api('nft/buy', { model: id }).then(r => { if (r.err) return toast(r.err); hapticN('success'); const d = r.drop;
      modal(`<div class="ribbon g">✨ ЛИМИТКА!</div><div class="rays" style="--rc:#c86bff"><img src="${icon('t', d.model, 140, d.attrs, d.serial)}"></div><div style="font-size:24px">${tankById(d.model).name} #${d.serial}</div><div class="muted">${nftBest(d)}</div><div class="row c"><button class="btn green" data-act="item" data-id="${d.id}">Открыть</button></div>`); render(); }); break;
    case 'faucet': api('dev/faucet').then(r => { if (r.err) return toast(r.err); toast('+1000 тестовых гемов'); mk.ts = 0; render(); }); break;
    case 'devdrop': api('dev/drop', { model: id }).then(r => { if (r.err) return toast(r.err); toast('Тестовая лимитка выдана'); render(); }); break;
    case 'close': closeModal(); render(); break;
    case 'lang': modal(`<div class="ribbon">🌐 Language</div><div class="row c" data-notr style="flex-wrap:wrap">${Object.entries(LANGS).map(([k, v]) => `<button class="btn ${k === LANG ? '' : 'gray'}" data-act="setLang" data-l="${k}">${v}</button>`).join('')}</div>`); break;
    case 'setLang': setLang(a.dataset.l); break;
    case 'reset': modal(`<div class="ribbon">Сбросить?</div><p class="muted">Все танки, серебро и звёзды удалятся.</p><div class="row c"><button class="btn red" data-act="doReset">Сбросить</button><button class="btn gray" data-act="close">Отмена</button></div>`); break;
    case 'doReset': if (ON) { api('reset').then(() => { closeModal(); setTab('home'); }); break; } S = DEF(); save(); closeModal(); setTab('home'); break;
    case 'pause': pauseMenu(); break;
    case 'resume': G.paused = false; closeModal(); break;
    case 'snd': SFX.toggle(); a.textContent = sndTxt(); break;
    case 'quit': exitBattle(); break;
    case 'retry': G.running = false; startLevel(G.n); break;
    case 'next': { const n = G.n + 1; exitBattle(); preBattle(n); break; }
    case 'map': exitBattle(); break;
    case 'garageFromBattle': exitBattle(); setTab('garage'); break;
  }
});

/* ======================= Старт ======================= */
(async () => {
  /* есть сервер игры — работаем онлайн, иначе офлайн-прототип */
  const h = await api('hello');
  if (h.ok && h.state) { ON = true; DEVMODE = !!h.dev; }
  else S = await loadState();
  if (!S.tut && S.stars[1]) S.tut = true;
  render();
  if (S.tut && dailyState().ready) setTimeout(dailyModal, 400);
  setInterval(() => { if (!G.running) { renderHeader(); tickUI(); } }, 1000);
})();
</script>
